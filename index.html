<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="hero-banner">
        <h1>AVENGERS CHARACTER SEARCH</h1>
    </header>

    <main class="container">
        <label for="search-input">Search by Full Name or Alias</label>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="e.g. Captain America or Steve Rogers">
            <button id="search-btn">Search</button>
        </div>

        <div class="result-section">
            <h2>RESULT</h2>
            <hr>
            <div id="result"></div>
        </div>
    </main>
</body>
</html>
